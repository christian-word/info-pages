<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Продвинутый MP4 Конвертер (FFmpeg)</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #141b24;
            color: #e2e8f0;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #1e293b;
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            color: #38bdf8;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
        }
        .field {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            background-color: #0284c7;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0369a1;
        }
        button:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f172a;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            font-size: 14px;
            white-space: pre-line;
        }
        .log-output {
            margin-top: 15px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #64748b;
            background: #090d16;
            padding: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>MP4 Видео Конвертер</h2>
    
    <div class="field">
        <label>Выберите исходное видео (любой формат):</label>
        <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="field">
        <label>Максимальное разрешение (высота кадра):</label>
        <select id="resSelect">
            <option value="720">720p (HD) — Отличный баланс</option>
            <option value="480">480p (SD) — Компактный размер</option>
            <option value="360">360p — Минимальный размер</option>
        </select>
    </div>

    <button id="startBtn" disabled>Загрузка конвертера...</button>

    <div class="status-box" id="status">Инициализация модулей FFmpeg...</div>
    <div class="log-output" id="logs"></div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    // Создаем экземпляр FFmpeg с выводом логов в консоль
    const ffmpeg = createFFmpeg({ log: true });

    const videoInput = document.getElementById('videoInput');
    const resSelect = document.getElementById('resSelect');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    const logsDiv = document.getElementById('logs');

    // Перехват логов FFmpeg для отображения на экране
    ffmpeg.setLogger(({ type, message }) => {
        logsDiv.innerText += `[${type}] ${message}\n`;
        logsDiv.scrollTop = logsDiv.scrollHeight;
    });

    // Асинхронная загрузка ядра FFmpeg
    async function initFFmpeg() {
        try {
            await ffmpeg.load();
            statusDiv.innerText = "Конвертер готов к работе. Выберите файл.";
            if(videoInput.files.length > 0) startBtn.disabled = false;
        } catch (error) {
            statusDiv.innerText = "Ошибка загрузки FFmpeg. Убедитесь, что страница запущена через сервер (localhost) и браузер поддерживает SharedArrayBuffer.";
            console.error(error);
        }
    }

    videoInput.addEventListener('change', () => {
        if (ffmpeg.isLoaded() && videoInput.files.length > 0) {
            startBtn.disabled = false;
            statusDiv.innerText = "Файл выбран. Нажмите кнопку для начала конвертации.";
        }
    });

    startBtn.addEventListener('click', async () => {
        const file = videoInput.files[0];
        if (!file) return;

        startBtn.disabled = true;
        statusDiv.innerText = "Шаг 1/3: Чтение и импорт файла в память...";

        const { name } = file;
        const targetHeight = resSelect.value;

        // Записываем файл во внутреннюю файловую систему FFmpeg.wasm
        ffmpeg.FS('writeFile', name, await fetchFile(file));

        statusDiv.innerText = `Шаг 2/3: Конвертация в MP4 (${targetHeight}p)...\nЭто может занять некоторое время в зависимости от длины видео.`;

        // Команда FFmpeg: 
        // -vf scale=-2:высота делает масштабирование, сохраняя пропорции кадра (кратно 2 для кодека x264)
        // -c:v libx264 включает стандартный эффективный кодек H.264
        // -crf 23 задает оптимальный уровень сжатия/качества (чем больше число, тем меньше файл)
        // -preset medium — баланс скорости и качества сжатия
        try {
            await ffmpeg.run(
                '-i', name, 
                '-vf', `scale=-2:${targetHeight}`, 
                '-c:v', 'libx264', 
                '-crf', '23', 
                '-preset', 'medium', 
                '-c:a', 'aac', 
                '-b:a', '128k', 
                'output.mp4'
            );

            statusDiv.innerText = "Шаг 3/3: Экспорт готового MP4...";

            // Читаем результат из виртуальной ФС
            const data = ffmpeg.FS('readFile', 'output.mp4');

            // Создаем ссылку для скачивания файла пользователем
            const blob = new Blob([data.buffer], { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `compressed_${targetHeight}p.mp4`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            statusDiv.innerText = "Успешно готово! Сжатый MP4 сохранен в загрузки.";
            
            // Чистим память виртуальной ФС
            ffmpeg.FS('unlink', name);
            ffmpeg.FS('unlink', 'output.mp4');
        } catch (err) {
            statusDiv.innerText = "Произошла ошибка при обработке видео. Проверьте консоль или логи.";
            console.error(err);
        } finally {
            startBtn.disabled = false;
        }
    });

    // Запускаем инициализацию при загрузке страницы
    initFFmpeg();
</script>

</body>
</html>
