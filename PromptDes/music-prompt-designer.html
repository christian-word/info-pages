<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Prompt Designer 2.6</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#eee;font-family:Arial,sans-serif;font-size:15px}

.header{padding:12px 15px;background:#1a1a1a;border-bottom:2px solid #00ffcc;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.header-title{font-size:18px;font-weight:bold;flex:1}
.header-counter{font-size:13px;color:#00ffcc;white-space:nowrap}

/* Desktop layout */
.wrap{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 53px)}
.left{overflow-y:auto;padding:12px;border-right:1px solid #333}
.right{padding:12px;display:flex;flex-direction:column;gap:10px}

/* Mobile layout */
@media(max-width:700px){
  .wrap{display:flex;flex-direction:column;height:auto;min-height:calc(100vh - 53px)}
  .left{border-right:none;border-bottom:1px solid #333;max-height:none}
  .right{flex:none}
}

.section{margin-bottom:12px;padding:10px;background:#1b1b1b;border-radius:8px;border-left:3px solid #333}
.section h3{margin:0 0 8px;color:#00ffcc;font-size:13px;text-transform:uppercase;letter-spacing:1px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.section h3 .arrow{font-size:11px;color:#555;transition:transform 0.2s}
.section h3.collapsed .arrow{transform:rotate(-90deg)}
.section-body{display:block}
.section-body.collapsed{display:none}

label{display:flex;align-items:flex-start;gap:8px;margin:5px 0;cursor:pointer;font-size:14px;line-height:1.4;transition:color 0.15s;padding:3px 0}
label:hover{color:#00ffcc}
label.disabled{color:#555;cursor:not-allowed;text-decoration:line-through}
label.disabled input{pointer-events:none}
label input[type=checkbox]{margin-top:2px;flex-shrink:0;accent-color:#00ffcc;width:15px;height:15px;cursor:pointer}

.topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{padding:7px 13px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:6px;cursor:pointer;font-size:13px;font-weight:bold;transition:0.15s}
button:hover{background:#333;color:#00ffcc;border-color:#00ffcc}
button.preset-btn{background:#1e1e1e;font-size:12px;padding:6px 10px}

.prompt-wrap{position:relative;flex:1;min-height:160px;display:flex;flex-direction:column}
@media(max-width:700px){.prompt-wrap{min-height:140px}}

textarea{flex:1;width:100%;background:#0f0f0f;color:#ddd;border:1px solid #444;border-radius:8px;padding:12px;font-size:14px;resize:vertical;line-height:1.5;min-height:120px}
textarea:focus{border-color:#00ffcc66;outline:none}

.info{font-size:12px;color:#888;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.char-val{font-weight:bold}
.warning-box{color:#ff8800;font-size:12px;display:none}
.conflict-box{color:#ff4444;font-size:12px;display:none}

.divider{color:#444;font-size:12px}

/* Копирование - вспышка */
@keyframes flash{0%,100%{background:#2a2a2a}50%{background:#00ffcc22}}
.flash{animation:flash 0.4s ease}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">🎵 Prompt Designer 2.6</div>
  <div class="header-counter"><span id="headerCounter">0</span> симв.</div>
</div>

<div class="wrap">
  <div class="left" id="left"></div>

  <div class="right">
    <div class="topbar" id="topbar">
      <button onclick="copyPrompt(this)">📋 Копировать</button>
      <button onclick="clearAll()">🧹 Очистить</button>
      <button onclick="randomPrompt()">🎲 Рандом</button>
      <span class="divider">|</span>
      <span style="color:#888;font-size:12px">Пресеты:</span>
    </div>

    <div class="prompt-wrap">
      <textarea id="promptTarget" placeholder="Выбирайте параметры или пресеты..."></textarea>
    </div>

    <div class="info">
      Длина: <span id="charCounter" class="char-val" style="color:#00ffcc">0</span> символов
      <span class="warning-box" id="warningBox">⚠️ Близко к лимиту, ИИ может проигнорировать конец</span>
      <span class="conflict-box" id="conflictBox">🚫 Конфликтующие параметры заблокированы</span>
    </div>
  </div>
</div>

<script>
const DATA = {
  "Качество и Сцена": [
    {en:"transparent mix",ru:"прозрачный микс (карман для инструментов)"},
    {en:"ultra-wide stereo field",ru:"сверхширокая стереобаза"},
    {en:"deep spatial imaging",ru:"глубокий 3D объём"},
    {en:"infinite reverb tails",ru:"бесконечные хвосты эха"},
    {en:"high-ceiling acoustics",ru:"высокие потолки (акустика собора)"},
    {en:"pristine fidelity",ru:"кристальная чистота"},
    {en:"pin-sharp transients",ru:"чёткая атака инструментов"},
    {en:"airy top-end",ru:"воздушные высокие частоты"},
    {en:"subterranean lows",ru:"глубокий суб-бас (ниже 60Гц)"}
  ],
  "Жанр": [
    {en:"melodic ambient instrumental",ru:"мелодичный эмбиент (инструментал)"},
    {en:"epic cinematic soundscape",ru:"эпический саундтрек"},
    {en:"cinematic ambient",ru:"кинематографичный эмбиент"},
    {en:"ambient soundtrack",ru:"атмосферный саундтрек"},
    {en:"orchestral ambient",ru:"оркестровый эмбиент"},
    {en:"spiritual soundscape",ru:"духовный звуковой пейзаж"},
    {en:"fantasy ambient",ru:"фэнтези эмбиент"},
    {en:"space ambient",ru:"космический эмбиент"}
  ],
  "Атмосфера": [
    {en:"warm, inspiring, peaceful, deeply atmospheric",ru:"тёплая, вдохновляющая, мирная атмосфера"},
    {en:"vast horizons",ru:"бескрайние горизонты"},
    {en:"endless skies",ru:"бесконечное небо"},
    {en:"subtle mystery",ru:"тонкая мистика"},
    {en:"quiet majesty",ru:"тихое величие"},
    {en:"wonder",ru:"чувство чуда"},
    {en:"transcendence",ru:"трансцендентность"},
    {en:"ancient light",ru:"древний свет"},
    {en:"hidden worlds",ru:"скрытые миры"},
    {en:"eternity",ru:"вечность"},
    {en:"space",ru:"пространство / космос"}
  ],
  "Мелодия и Гармония": [
    {en:"emotional lead melody",ru:"эмоциональная главная мелодия"},
    {en:"memorable emotional melody",ru:"запоминающаяся мелодия"},
    {en:"soaring lead melody",ru:"парящая главная мелодия"},
    {en:"strong focus on melody and emotion",ru:"акцент на мелодию и эмоции"},
    {en:"gentle tension and beautiful resolution",ru:"мягкое напряжение и красивый финал"},
    {en:"minimalist arrangement",ru:"минималистичная аранжировка"}
  ],
  "Инструменты": [
    {en:"felt piano",ru:"фетровое пианино (мягкое)"},
    {en:"mechanical key noise",ru:"механический шум клавиш"},
    {en:"soft piano",ru:"мягкое пианино"},
    {en:"celesta sparkles",ru:"мерцание челесты"},
    {en:"soft nylon guitar",ru:"мягкая нейлоновая гитара"},
    {en:"beautiful guitar solo",ru:"красивое соло на гитаре"},
    {en:"ambient electric guitar with delay",ru:"эмбиент-электрогитара с дилеем"},
    {en:"lush shimmering pads",ru:"пышные мерцающие пэды"},
    {en:"atmospheric pads",ru:"атмосферные пэды"},
    {en:"cinematic strings",ru:"кинематографичные струнные"},
    {en:"soft cello",ru:"мягкая виолончель"},
    {en:"ethereal soaring choir",ru:"эфирный парящий хор"},
    {en:"epic cinematic choir",ru:"мощный эпический хор"},
    {en:"massive cathedral organ",ru:"мощный соборный орган"},
    {en:"powerful analog synthesizers",ru:"мощные аналоговые синты"},
    {en:"granular synthetic textures",ru:"зернистые синт-текстуры"},
    {en:"woodwind flute melodies",ru:"мелодии деревянной флейты"},
    {en:"soft mallets",ru:"мягкие маримбы / колотушки"}
  ],
  "Структура трека": [
    {en:"intimate opening",ru:"тихое вступление"},
    {en:"gradual build",ru:"постепенное нарастание"},
    {en:"majestic climax",ru:"величественная кульминация"},
    {en:"peaceful ending",ru:"спокойный финал"}
  ],
  "Ограничения": [
    {en:"no rhythm",ru:"без ритма / ударных"},
    {en:"no vocals",ru:"без вокала"},
    {en:"no drums",ru:"без барабанов"},
    {en:"no aggressive percussion",ru:"без жёсткой перкуссии"}
  ]
};

const PRESETS = {
  "Эпик (Орган/Хор)": [
    "massive cathedral organ","ethereal soaring choir","high-ceiling acoustics",
    "ultra-wide stereo field","subterranean lows","transparent mix","epic cinematic soundscape"
  ],
  "Гитара Эмбиент": [
    "soft nylon guitar","infinite reverb tails","airy top-end",
    "pristine fidelity","lush shimmering pads","deep spatial imaging","minimalist arrangement"
  ],
  "Глубокий Космос": [
    "granular synthetic textures","space ambient","ultra-wide stereo field",
    "pin-sharp transients","infinite reverb tails","subterranean lows"
  ],
  "Эмоциональное Пианино": [
    "felt piano","mechanical key noise","strong focus on melody and emotion",
    "transparent mix","pristine fidelity","gentle tension and beautiful resolution"
  ],
  "Мистическое Фэнтези": [
    "woodwind flute melodies","celesta sparkles","fantasy ambient",
    "soft mallets","pristine fidelity","subtle mystery","infinite reverb tails"
  ]
};

// Конфликты — расширенная система
const CONFLICTS = [
  {
    triggers: ["massive cathedral organ"],
    block: ["powerful analog synthesizers","granular synthetic textures"],
    reason: "Орган и тяжёлые синты забьют весь частотный спектр"
  },
  {
    triggers: ["beautiful guitar solo","ambient electric guitar with delay","soft nylon guitar"],
    block: ["soft piano","felt piano"],
    reason: "Два сольных инструмента (гитара + пианино) создадут кашу в ритме"
  },
  {
    triggers: ["no vocals"],
    block: ["ethereal soaring choir","epic cinematic choir"],
    reason: "Хор — это вокал; противоречит ограничению 'без вокала'"
  },
  {
    triggers: ["no drums","no aggressive percussion","no rhythm"],
    block: ["gradual build","majestic climax"],
    reason: "Нарастание без ритма крайне сложно — возможен конфликт ожиданий"
  },
  {
    triggers: ["space ambient"],
    block: ["massive cathedral organ","cinematic strings","orchestral ambient"],
    reason: "Космический эмбиент плохо сочетается с акустическими оркестровыми инструментами"
  },
  {
    triggers: ["minimalist arrangement"],
    block: ["lush shimmering pads","cinematic strings","powerful analog synthesizers","epic cinematic choir"],
    reason: "Минимализм и насыщенная аранжировка — прямое противоречие"
  }
];

// Генерация уникального ID без btoa (надёжно для кириллицы)
function makeId(en) {
  return 'cb_' + en.replace(/[^a-zA-Z0-9]/g, '_');
}

const leftContainer = document.getElementById('left');
const topbar = document.getElementById('topbar');
const promptTA = document.getElementById('promptTarget');
const charCounter = document.getElementById('charCounter');
const headerCounter = document.getElementById('headerCounter');
const warningBox = document.getElementById('warningBox');
const conflictBox = document.getElementById('conflictBox');

// Флаг: пользователь редактировал вручную
let manualEdit = false;

function initApp() {
  // Секции
  for (const cat in DATA) {
    const sectionId = 'sec_' + cat.replace(/[^a-zA-Z0-9а-яА-Я]/g,'_');
    let html = `<div class="section">
      <h3 onclick="toggleSection('${sectionId}')" id="h_${sectionId}">
        ${cat} <span class="arrow">▼</span>
      </h3>
      <div class="section-body" id="${sectionId}">`;
    DATA[cat].forEach(v => {
      const id = makeId(v.en);
      html += `<label id="lbl_${id}"><input type="checkbox" id="${id}" value="${v.en}" onchange="onCheck()"> ${v.ru}</label>`;
    });
    html += '</div></div>';
    leftContainer.insertAdjacentHTML('beforeend', html);
  }

  // Пресеты
  for (const name in PRESETS) {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = name;
    btn.onclick = () => loadPreset(name);
    topbar.appendChild(btn);
  }

  // Ручное редактирование textarea
  promptTA.addEventListener('input', () => {
    manualEdit = true;
    updateCounter(promptTA.value.length);
  });
}

function toggleSection(id) {
  const body = document.getElementById(id);
  const h = document.getElementById('h_' + id);
  const collapsed = body.classList.toggle('collapsed');
  h.classList.toggle('collapsed', collapsed);
}

function onCheck() {
  manualEdit = false;
  checkConflicts();
  buildPrompt();
}

function checkConflicts() {
  // Сбрасываем блокировки
  document.querySelectorAll('label').forEach(l => l.classList.remove('disabled'));
  document.querySelectorAll('input[type=checkbox]').forEach(cb => cb.disabled = false);

  const active = [...document.querySelectorAll('input[type=checkbox]:checked')].map(x => x.value);
  let hasConflict = false;

  CONFLICTS.forEach(rule => {
    const triggered = rule.triggers.some(t => active.includes(t));
    if (!triggered) return;

    rule.block.forEach(b => {
      const cb = document.querySelector(`input[type=checkbox][value="${CSS.escape(b)}"]`);
      if (!cb) return;
      if (cb.checked) { cb.checked = false; hasConflict = true; }
      cb.disabled = true;
      const lbl = document.getElementById('lbl_' + makeId(b));
      if (lbl) lbl.classList.add('disabled');
    });
  });

  conflictBox.style.display = hasConflict ? 'inline' : 'none';
}

function buildPrompt() {
  if (manualEdit) return;
  const arr = [...document.querySelectorAll('input[type=checkbox]:checked')].map(x => x.value);
  promptTA.value = arr.join(', ');
  updateCounter(promptTA.value.length);
}

function updateCounter(len) {
  charCounter.textContent = len;
  headerCounter.textContent = len;
  if (len > 280) {
    charCounter.style.color = '#ff4444';
    warningBox.style.display = 'inline';
    warningBox.style.color = '#ff4444';
  } else if (len > 180) {
    charCounter.style.color = '#ffbb00';
    warningBox.style.display = 'inline';
    warningBox.style.color = '#ffbb00';
  } else {
    charCounter.style.color = '#00ffcc';
    warningBox.style.display = 'none';
  }
}

function clearAll() {
  manualEdit = false;
  document.querySelectorAll('input[type=checkbox]').forEach(x => { x.checked = false; x.disabled = false; });
  document.querySelectorAll('label').forEach(l => l.classList.remove('disabled'));
  conflictBox.style.display = 'none';
  warningBox.style.display = 'none';
  buildPrompt();
}

function loadPreset(name) {
  clearAll();
  if (!PRESETS[name]) return;
  PRESETS[name].forEach(v => {
    const cb = document.querySelector(`input[type=checkbox][value="${CSS.escape(v)}"]`);
    if (cb) cb.checked = true;
  });
  checkConflicts();
  buildPrompt();
}

function randomPrompt() {
  clearAll();
  document.querySelectorAll('input[type=checkbox]').forEach(cb => {
    if (Math.random() < 0.13) cb.checked = true;
  });
  checkConflicts();
  buildPrompt();
}

function copyPrompt(btn) {
  const text = promptTA.value;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).catch(() => {
    promptTA.select();
    document.execCommand('copy');
  });
  const orig = btn.textContent;
  btn.textContent = '✅ Скопировано!';
  btn.classList.add('flash');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('flash'); }, 1500);
}

initApp();
</script>
</body>
</html>
